<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
  body{margin:0;background:#fff;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;line-height:1.8}
  .box{max-width:520px;text-align:center}
  h1{font-size:20px;margin:0 0 16px}

<div class="box">

  <p>自動で移動します。切り替わらない場合は下のボタンを押してください。<br>

  <a class="btn" href="https://squadbeyond-domain-check.pages.dev/">新しいページを開く</a>
  <div class="url">https://squadbeyond-domain-check.pages.dev/</div>
</div>
<script>
  // クエリやハッシュが付いたURLで来た場合も引き継ぐ
  location.replace("https://squadbeyond-domain-check.pages.dev/".replace(/\/$/,"/") + location.search + location.hash);
